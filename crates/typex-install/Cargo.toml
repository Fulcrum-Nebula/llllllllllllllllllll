[package]
name = "typex-install"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_TextServices", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
